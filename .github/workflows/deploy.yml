name: Deploy to Google Cloud VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 35.247.143.94
          username: emirencegumban
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/html
            git fetch origin
            git reset --hard origin/main

            if ! grep -q "responseText" /var/www/html/Pages/Page.php; then
              echo "Deployment verification failed: /var/www/html/Pages/Page.php is not up to date"
              exit 1
            fi

            sudo cp /var/www/server-config/config.php /var/www/html/config.php
            sudo chown www-data:www-data /var/www/html/config.php

            sudo systemctl restart apache2

            echo "Deployment completed successfully!"